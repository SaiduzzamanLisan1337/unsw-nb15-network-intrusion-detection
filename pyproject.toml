[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-network-intrusion-detection"
version = "2.0.0"
description = "Reproducible machine-learning baseline for network intrusion detection using UNSW-NB15."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["src"]
